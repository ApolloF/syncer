ShortDescription: Keeps PC game saves in sync between your Windows PCs with Syncthing, with a versioned Google Drive backup.
Description: |-
  Syncer finds the saves of about 14,000 games (save locations from PCGamingWiki, through the Ludusavi manifest) and keeps them in sync between your Windows PCs with Syncthing, end-to-end encrypted and without a cloud in between.
  It also keeps a versioned backup in your own Google Drive, with restore points you can roll back to.
  When two PCs changed the same save, it asks which one to keep instead of guessing, and it leaves folders that Steam Cloud, OneDrive or Ubisoft Connect already sync to them.
