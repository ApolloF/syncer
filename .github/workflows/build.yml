name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Read-only by default; only the release job below gets more.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.x' # latest patch: releases ship Go's security fixes
          check-latest: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install NSIS
        run: |
          choco install nsis --version 3.13.0 -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Check frontend
        working-directory: frontend
        run: npm run check

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Test
        run: go test ./...

      - name: Test (personal build)
        # The personal build is tested too (see internal/features).
        run: go test -tags personal ./...

      - name: Version
        # Release builds carry their tag (shown in the app, used by the update
        # check) and put it in the exe's file properties; others are "dev".
        run: |
          $v = 'dev'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME
            if ($v -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Unexpected release tag: $v" }
            $j = Get-Content wails.json -Raw | ConvertFrom-Json
            $j.info.productVersion = ($v.TrimStart('v') -split '[-+]')[0]
            $j | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8
          }
          "SYNCER_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        # The public release: no build tags, so no mods, Google sign-in or
        # launcher integration, and no Google OAuth client. The personal build
        # (wails build -tags personal) is made locally, with GDRIVE_CLIENT_ID /
        # GDRIVE_CLIENT_SECRET passed as -X main.gdriveClientID / gdriveClientSecret.
        run: wails build -clean -nsis -trimpath -ldflags "-s -w -X main.version=$env:SYNCER_VERSION"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Syncer
          path: |
            build/bin/Syncer.exe
            build/bin/Syncer-amd64-installer.exe

  release:
    # Only for tags; pull requests never get a token that can write.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # sign the provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Syncer
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum Syncer.exe Syncer-amd64-installer.exe | tee SHA256SUMS.txt

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/Syncer.exe
            dist/Syncer-amd64-installer.exe

      - name: Draft release
        # A draft: the owner smoke-tests the assets and publishes by hand (see
        # RELEASING.md). A tag with a "-" (v1.2.0-rc1) is a pre-release.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Syncer-amd64-installer.exe
            dist/Syncer.exe
            dist/SHA256SUMS.txt
